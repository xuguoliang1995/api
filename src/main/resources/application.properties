spring.application.name=my-first-project-api

# 后端监听端口；前端 dev server 会把它作为 /api 代理目标
server.port=8080

# --- 数据源 ---------------------------------------------------------------
# 凭据一律走环境变量，仓库里不出现任何可用密钥（见 harness/rules/30）。
# 刻意用 127.0.0.1 而非 localhost：本机 localhost 优先解析到 ::1，
# 与只监听 IPv4 的数据库错位会表现为连接超时。
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/myfirstproject}
spring.datasource.username=${DB_USERNAME:myfirstproject}
spring.datasource.password=${DB_PASSWORD:myfirstproject}

# --- JPA ------------------------------------------------------------------
# 测试由 Testcontainers 的 @ServiceConnection 覆盖上述连接信息，无需另写 profile。
# ddl-auto 固定为 validate：建表由迁移负责，应用启动时只校验，不擅自改结构。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

